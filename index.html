<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Boo's Nook</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tiny5:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <main id="stage">
        <header id="title">
            <p>keep our little ghost company :)</p>
        </header>
        <canvas id="room" width="256" height="192"></canvas>
        <div id="hint"></div>
    </main>

    <footer id="credit">inspo: "Oh Klahoma" by Jack Stauber</footer>

    <div id="diary" class="overlay" hidden>
        <div class="book" role="dialog" aria-label="the ghost's diary">
            <button class="close" id="diary-close" aria-label="close diary">x</button>
            <div class="page" id="diary-page">
                <div class="page-date" id="diary-date"></div>
                <h2 class="page-title" id="diary-title"></h2>
                <div class="page-art" id="diary-art"></div>
                <p class="page-body" id="diary-body"></p>
            </div>
            <div class="book-nav">
                <button id="diary-prev">&lt; prev</button>
                <span id="diary-num"></span>
                <button id="diary-next">next &gt;</button>
            </div>
        </div>
    </div>

    <div id="radio" class="overlay" hidden>
        <div class="radio-box" role="dialog" aria-label="the ghost's radio">
            <button class="close" id="radio-close" aria-label="close radio">x</button>

            <div class="radio-display">
                <div id="radio-name">GHOST FM</div>
                <div id="radio-freq">103.1</div>
                <div id="radio-mood">nostalgic indie</div>
            </div>

            <canvas id="radio-vis" width="128" height="24"></canvas>

            <div class="dial">
                <div class="dial-needle" id="radio-needle"></div>
            </div>

            <div class="radio-controls">
                <!-- <button id="radio-prev">&lt; tune</button> -->
                <button id="radio-power">power</button>
                <!-- <button id="radio-next">tune &gt;</button> -->
            </div>

            <div id="radio-player"></div>
            <p class="radio-hint" id="radio-hint"></p>
            <p id="radio-ghost"></p>
        </div>
    </div>

    <div id="candy" class="overlay" hidden>
        <div class="candy-box" role="dialog" aria-label="the candy basket">
            <button class="close" id="candy-close" aria-label="close basket">x</button>
            <h2 class="candy-title">the candy basket</h2>
            <p id="candy-count"></p>
            <p id="candy-latest"></p>
            <p class="candy-sub">recently left:</p>
            <div id="candy-gallery"></div>
            <p class="candy-sub">pick a treat to leave behind:</p>
            <div id="candy-picker"></div>
            <p class="candy-you">you'll be known as <b id="candy-myname"></b> <button id="candy-reroll">new
                    name</button></p>
            <button id="candy-leave" disabled>leave a treat</button>
            <p id="candy-status"></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/candy.js"></script>
    <script src="js/room.js"></script>
    <script src="js/sky.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/ghost.js"></script>
    <script src="js/diary.js"></script>
    <script src="js/radio.js"></script>
    <script src="js/candy_ui.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
